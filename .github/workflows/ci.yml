name: CI

# Every PR into dev or main (and every push to dev) must still build:
# the same `npm run build` used for releases (polyfills + next build).
on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
