<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GarraTV</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="screen-loading" class="screen">
        <div class="spinner"></div>
    </div>

    <div id="screen-login" class="screen hidden">
        <div class="panel">
            <div class="badge"></div>
            <h1>Entrar com Xtream Codes</h1>
            <p class="lead">Use o endereço, o usuário e a senha que o seu provedor de IPTV enviou.</p>

            <label class="label" for="portal-input">URL do servidor</label>
            <input id="portal-input" type="text" class="field" placeholder="http://servidor.com:8080"
                   autocomplete="off" autocorrect="off" spellcheck="false" data-focusable="true">

            <label class="label" for="user-input">Usuário</label>
            <input id="user-input" type="text" class="field" placeholder="seu_usuario"
                   autocomplete="off" autocorrect="off" spellcheck="false" data-focusable="true">

            <label class="label" for="pass-input">Senha</label>
            <input id="pass-input" type="password" class="field" placeholder="••••••••"
                   autocomplete="off" data-focusable="true">

            <p id="login-error" class="error hidden"></p>

            <button id="login-submit" class="button" data-focusable="true">Entrar</button>
        </div>
    </div>

    <div id="screen-home" class="stage hidden">
        <div class="topbar">
            <button id="tab-live" class="tab" data-focusable="true" data-section="live">Ao vivo</button>
            <button id="tab-movie" class="tab" data-focusable="true" data-section="movie">Filmes</button>
            <button id="tab-series" class="tab" data-focusable="true" data-section="series">Séries</button>
            <button id="logout" class="tab tab-quiet" data-focusable="true">Sair</button>
        </div>
        <div class="columns">
            <div id="cat-col" class="column"></div>
            <div id="item-col" class="column column-wide"></div>
        </div>
    </div>

    <div id="screen-player" class="stage hidden">
        <video id="player"></video>
        <div id="player-title" class="player-title"></div>
    </div>

    <script src="server.js"></script>
    <script src="app.js"></script>
</body>
</html>
